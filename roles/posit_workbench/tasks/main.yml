---
# Installs the latest R, Python, Posit Workbench, Quarto and Posit Professional
# Drivers (ODBC) on an existing Ubuntu 24.04 VM.
#
# Run:  ansible-playbook -i inventory.ini posit-workbench.yml
#
# Follows the Posit docs:
#   R          https://docs.posit.co/resources/install-r/
#   Python     https://docs.posit.co/resources/install-python-uv.html
#   Workbench  https://docs.posit.co/ide/server-pro/admin/getting_started/installation/installation.html
#   Jupyter    https://docs.posit.co/ide/server-pro/admin/integration/jupyter-standalone.html
#   Quarto     https://docs.posit.co/resources/install-quarto.html
#   ODBC       https://docs.posit.co/data-sources/admin/pro-drivers/installation.html

- name: Install R, Python and Posit Workbench on Ubuntu 24.04
  hosts: workbench
  become: true

  # Asked when the playbook starts. Press Enter to skip.
  # Skipped automatically if you pass them with -e.
  vars_prompt:
    - name: workbench_license_key
      prompt: "Posit Workbench license key (Enter to skip)"
      private: true
      default: ""
    - name: workbench_test_password
      prompt: "Password for Workbench test user 'posituser' (Enter to skip)"
      private: true
      default: ""

  vars:
    # ---- R --------------------------------------------------------------
    r_latest_minor_count: 2     # newest patch of the 2 newest R lines (e.g. 4.6.x + 4.5.x)
    r_versions: []              # or pin exact versions, e.g. ["4.6.2", "4.5.3"]

    # ---- Python ---------------------------------------------------------
    python_versions: ["3.14", "3.13"]   # uv installs the newest patch of each
    python_jupyter_version: "3.13"      # Python that runs JupyterLab

    # ---- Workbench ------------------------------------------------------
    workbench_version: latest   # or pin, e.g. "2026.11.0+203.pro4"
    workbench_port: 8787
    workbench_test_user: posituser

    # ---- Quarto ---------------------------------------------------------
    quarto_version: latest      # or pin, e.g. "1.9.38"

    # ---- ODBC (Posit Professional Drivers) ------------------------------
    install_pro_drivers: true   # SQL Server, Oracle, PostgreSQL, Snowflake, ...

  handlers:
    - name: Restart Workbench
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: [rstudio-launcher, rstudio-server]

  tasks:
    # =====================================================================
    # Step 1 - Check the VM
    # =====================================================================
    - name: Confirm the VM is Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'
        fail_msg: "This playbook targets Ubuntu 24.04. Found {{ ansible_distribution }} {{ ansible_distribution_version }}."

    - name: Warn if the VM is smaller than Posit recommends (4 CPU / 8 GB RAM)
      ansible.builtin.debug:
        msg: "WARNING: {{ ansible_processor_vcpus }} vCPU, {{ ansible_memtotal_mb }} MB RAM."
      when: ansible_processor_vcpus < 4 or ansible_memtotal_mb < 7500

    - name: Install base packages
      ansible.builtin.apt:
        name: [curl, ca-certificates, gnupg, python3]
        update_cache: true
        cache_valid_time: 3600

    # =====================================================================
    # Step 2 - R  (Posit precompiled binaries -> /opt/R/<version>)
    # =====================================================================
    - name: Look up the newest R versions published by Posit
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://cdn.posit.co/r/versions.json | python3 -c '
        import json, sys
        data = json.load(sys.stdin)
        versions = data.get("r_versions", []) if isinstance(data, dict) else data
        releases = sorted({v for v in versions if v.count(".") == 2 and v.replace(".", "").isdigit()},
                          key=lambda v: tuple(int(p) for p in v.split(".")))
        newest_per_minor = {}
        for v in reversed(releases):
            newest_per_minor.setdefault(v.rsplit(".", 1)[0], v)
        print(json.dumps(list(newest_per_minor.values())[: int(sys.argv[1])]))
        ' {{ r_latest_minor_count }}
      args:
        executable: /bin/bash
      register: r_lookup
      changed_when: false
      when: r_versions | length == 0

    - name: Decide which R versions to install
      ansible.builtin.set_fact:
        r_install: "{{ r_versions if r_versions | length > 0 else r_lookup.stdout | from_json }}"

    - name: Install R
      ansible.builtin.apt:
        deb: "https://cdn.posit.co/r/ubuntu-2404/pkgs/r-{{ item }}_1_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.deb"
      loop: "{{ r_install }}"

    - name: Make the newest R the default (R and Rscript in /usr/local/bin)
      ansible.builtin.file:
        src: "/opt/R/{{ r_install[0] }}/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop: [R, Rscript]

    - name: Use Posit Public Package Manager (fast Linux binaries) for R packages
      ansible.builtin.copy:
        dest: "/opt/R/{{ item }}/lib/R/etc/Rprofile.site"
        mode: "0644"
        content: |
          # Managed by Ansible
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])))
      loop: "{{ r_install }}"

    # =====================================================================
    # Step 3 - Python  (uv -> /opt/python/<version>)
    # =====================================================================
    - name: Install uv
      ansible.builtin.shell: >-
        curl -LsSf https://astral.sh/uv/install.sh
        | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
      args:
        creates: /usr/local/bin/uv

    - name: Install Python versions
      ansible.builtin.command: >-
        /usr/local/bin/uv python install {{ python_versions | join(' ') }}
        --install-dir=/opt/python
      register: uv_install
      changed_when: "'Installed' in uv_install.stderr"

    - name: Get the exact version and folder of each Python
      ansible.builtin.shell: |
        set -euo pipefail
        py=$(UV_PYTHON_INSTALL_DIR=/opt/python UV_PYTHON_PREFERENCE=only-managed \
             UV_PYTHON_DOWNLOADS=never /usr/local/bin/uv python find {{ item }})
        "$py" -c 'import os, sys, platform; print(platform.python_version()); print(os.path.realpath(sys.base_prefix))'
      args:
        executable: /bin/bash
        chdir: /
      loop: "{{ python_versions }}"
      register: py_info
      changed_when: false

    - name: Record Python versions
      ansible.builtin.set_fact:
        python_exact: "{{ py_info.results | map(attribute='stdout_lines') | map('first') | list }}"
        python_by_minor: "{{ dict(python_versions | zip(py_info.results | map(attribute='stdout_lines') | map('first'))) }}"

    - name: Create /opt/python/<version> links (Posit layout)
      ansible.builtin.file:
        src: "{{ item.stdout_lines[1] }}"
        dest: "/opt/python/{{ item.stdout_lines[0] }}"
        state: link
      loop: "{{ py_info.results }}"
      loop_control:
        label: "{{ item.stdout_lines[0] }}"

    - name: Install ipykernel in each Python
      ansible.builtin.command: >-
        /opt/python/{{ item }}/bin/python -m pip install --upgrade pip ipykernel
        --break-system-packages --root-user-action=ignore
      loop: "{{ python_exact }}"
      register: pip_kernel
      changed_when: "'Successfully installed' in pip_kernel.stdout"

    - name: Register each Python as a Jupyter kernel
      ansible.builtin.command: >-
        /opt/python/{{ item }}/bin/python -m ipykernel install
        --name py{{ item }} --display-name "Python {{ item }}"
      args:
        creates: "/usr/local/share/jupyter/kernels/py{{ item }}/kernel.json"
      loop: "{{ python_exact }}"

    - name: Install JupyterLab 4 and the Workbench extension
      ansible.builtin.command: >-
        /opt/python/{{ python_by_minor[python_jupyter_version] }}/bin/python -m pip install
        'jupyterlab>=4,<5' notebook 'pwb_jupyterlab~=1.1'
        --break-system-packages --root-user-action=ignore
      register: pip_jupyter
      changed_when: "'Successfully installed' in pip_jupyter.stdout"

    - name: Put the Jupyter Python on everyone's PATH
      ansible.builtin.copy:
        dest: /etc/profile.d/python.sh
        mode: "0644"
        content: |
          # Managed by Ansible
          export PATH=/opt/python/{{ python_by_minor[python_jupyter_version] }}/bin:$PATH

    # =====================================================================
    # Step 4 - Posit Workbench  (Posit package repository)
    # =====================================================================
    - name: Add the Posit package repository
      ansible.builtin.deb822_repository:
        name: posit-pro
        types: deb
        uris: https://dl.posit.co/public/pro/deb/ubuntu
        suites: noble
        components: main
        signed_by: https://dl.posit.co/public/pro/gpg.51C0B5BB19F92D60.key

    - name: Install Posit Workbench
      ansible.builtin.apt:
        name: "{{ 'rstudio-server' if workbench_version == 'latest' else 'rstudio-server=' ~ workbench_version }}"
        state: "{{ 'latest' if workbench_version == 'latest' else 'present' }}"
        update_cache: true
        allow_change_held_packages: true
      notify: Restart Workbench

    - name: Hold the Workbench package so OS updates don't upgrade it
      ansible.builtin.dpkg_selections:
        name: rstudio-server
        selection: hold

    # =====================================================================
    # Step 5 - Quarto  (GitHub release tarball -> /opt/quarto/<version>)
    # Ref: https://docs.posit.co/resources/install-quarto.html
    # =====================================================================
    - name: Look up the latest Quarto release
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest \
          | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))'
      args:
        executable: /bin/bash
      register: quarto_lookup
      changed_when: false
      when: quarto_version == 'latest'

    - name: Decide which Quarto version to install
      ansible.builtin.set_fact:
        quarto_install: "{{ quarto_lookup.stdout | trim if quarto_version == 'latest' else quarto_version }}"
        quarto_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Create the Quarto folder
      ansible.builtin.file:
        path: "/opt/quarto/{{ quarto_install }}"
        state: directory
        mode: "0755"

    - name: Download and unpack Quarto
      ansible.builtin.unarchive:
        src: "https://github.com/quarto-dev/quarto-cli/releases/download/v{{ quarto_install }}/quarto-{{ quarto_install }}-linux-{{ quarto_arch }}.tar.gz"
        dest: "/opt/quarto/{{ quarto_install }}"
        remote_src: true
        extra_opts: [--strip-components=1]
        creates: "/opt/quarto/{{ quarto_install }}/bin/quarto"

    - name: Make this Quarto the default (/usr/local/bin/quarto)
      ansible.builtin.file:
        src: "/opt/quarto/{{ quarto_install }}/bin/quarto"
        dest: /usr/local/bin/quarto
        state: link
        force: true

    - name: Verify Quarto
      ansible.builtin.command: /opt/quarto/{{ quarto_install }}/bin/quarto check install
      changed_when: false

    # =====================================================================
    # Step 6 - ODBC: Posit Professional Drivers (Posit package repository)
    # Ref: https://docs.posit.co/data-sources/admin/pro-drivers/installation.html
    # =====================================================================
    - name: Install the ODBC driver manager and Posit Professional Drivers
      ansible.builtin.apt:
        name: [unixodbc, unixodbc-dev, rstudio-drivers]
        state: latest
        update_cache: true
      when: install_pro_drivers | bool

    - name: Find Oracle Instant Client folders (Ubuntu 24.04 libaio fix)
      ansible.builtin.find:
        paths: /usr/lib/oracle
        patterns: "lib"
        file_type: directory
        recurse: true
      register: oracle_libs
      when: install_pro_drivers | bool

    - name: Link renamed libaio for the Oracle client (Ubuntu 24.04)
      ansible.builtin.file:
        src: "/lib/{{ ansible_architecture }}-linux-gnu/libaio.so.1t64"
        dest: "{{ item.path }}/libaio.so.1"
        state: link
      loop: "{{ oracle_libs.files | default([]) | selectattr('path', 'search', 'client64/lib$') | list }}"
      loop_control:
        label: "{{ item.path }}"
      when: install_pro_drivers | bool

    - name: Read the driver list shipped with the drivers
      ansible.builtin.slurp:
        src: /opt/rstudio-drivers/odbcinst.ini.sample
      register: odbc_sample
      when: install_pro_drivers | bool

    - name: Register the drivers in /etc/odbcinst.ini (no duplicates on re-run)
      ansible.builtin.blockinfile:
        path: /etc/odbcinst.ini
        create: true
        backup: true
        mode: "0644"
        marker: "# {mark} Posit Professional Drivers (managed by Ansible)"
        block: "{{ odbc_sample.content | b64decode }}"
      when: install_pro_drivers | bool

    # =====================================================================
    # Step 7 - Configure Workbench
    # =====================================================================
    - name: Set the Workbench port
      ansible.builtin.lineinfile:
        path: /etc/rstudio/rserver.conf
        regexp: '^#?\s*www-port='
        line: "www-port={{ workbench_port }}"
        create: true
        mode: "0644"
      notify: Restart Workbench

    - name: Configure the Launcher for local sessions (only if missing)
      ansible.builtin.copy:
        dest: /etc/rstudio/launcher.conf
        force: false
        mode: "0644"
        content: |
          [server]
          address=127.0.0.1
          port=5559
          server-user=rstudio-server
          admin-group=rstudio-server
          authorization-enabled=1
          thread-pool-size=4
          enable-debug-logging=0

          [cluster]
          name=Local
          type=Local
      notify: Restart Workbench

    - name: Tell Workbench which R versions exist
      ansible.builtin.copy:
        dest: /etc/rstudio/r-versions
        mode: "0644"
        content: |
          {% for v in r_install %}
          /opt/R/{{ v }}
          {% endfor %}
      notify: Restart Workbench

    - name: Enable JupyterLab and Jupyter Notebook sessions
      ansible.builtin.copy:
        dest: /etc/rstudio/jupyter.conf
        mode: "0644"
        content: |
          jupyter-exe=/opt/python/{{ python_by_minor[python_jupyter_version] }}/bin/jupyter
          labs-enabled=1
          notebooks-enabled=1
          default-session-cluster=Local
      notify: Restart Workbench

    - name: Enable VS Code and Positron sessions
      ansible.builtin.lineinfile:
        path: "/etc/rstudio/{{ item }}"
        regexp: '^#?\s*enabled='
        line: enabled=1
        create: true
        mode: "0644"
      loop: [vscode.conf, positron.conf]
      notify: Restart Workbench

    - name: Create a test user for signing in
      ansible.builtin.user:
        name: "{{ workbench_test_user }}"
        shell: /bin/bash
        create_home: true
      register: test_user
      when: workbench_test_password | length > 0

    - name: Set the test user's password
      ansible.builtin.command: chpasswd
      args:
        stdin: "{{ workbench_test_user }}:{{ workbench_test_password }}"
      no_log: true
      when: test_user is changed

    - name: Check the license status
      ansible.builtin.command: rstudio-server license-manager status
      register: license_status
      changed_when: false
      failed_when: false

    - name: Activate the license
      ansible.builtin.command: rstudio-server license-manager activate {{ workbench_license_key | quote }}
      no_log: true
      when:
        - workbench_license_key | length > 0
        - "'Activated' not in license_status.stdout"
      notify: Restart Workbench

    - name: Check whether the ufw firewall is on
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Open the Workbench port in ufw (only if ufw is on)
      ansible.builtin.command: ufw allow {{ workbench_port }}/tcp
      when: "'Status: active' in ufw_status.stdout"
      changed_when: true

    # =====================================================================
    # Step 8 - Start and verify
    # =====================================================================
    - name: Apply restarts now
      ansible.builtin.meta: flush_handlers

    - name: Make sure Workbench starts on boot and is running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [rstudio-launcher, rstudio-server]

    - name: Check that the sign-in page responds
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ workbench_port }}/auth-sign-in"
        status_code: 200
      register: signin
      retries: 10
      delay: 6
      until: signin.status == 200

    - name: Read installed versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - rstudio-server version
        - rstudio-server license-manager status
        - odbcinst -q -d
      register: final
      changed_when: false
      failed_when: false

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Workbench : {{ final.results[0].stdout | trim }}"
          - "R         : {{ r_install | join(', ') }} (default {{ r_install[0] }})"
          - "Python    : {{ python_exact | join(', ') }} (Jupyter on {{ python_by_minor[python_jupyter_version] }})"
          - "Quarto    : {{ quarto_install }} (/usr/local/bin/quarto)"
          - "ODBC      : {{ final.results[2].stdout_lines | join(' ') if install_pro_drivers | bool else 'not installed' }}"
          - "License   : {{ final.results[1].stdout_lines | select('search', 'Status') | first | default('see: sudo rstudio-server license-manager status') }}"
          - "Open      : http://{{ ansible_host }}:{{ workbench_port }}"
