---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['os_family'] | lower }}.yml"
      paths:
        - vars

- name: Add the Posit package repository
  ansible.builtin.deb822_repository:
    name: posit-pro
    types: deb
    uris: https://dl.posit.co/public/pro/deb/ubuntu
    suites: noble
    components: main
    signed_by: https://dl.posit.co/public/pro/gpg.51C0B5BB19F92D60.key
    install_python_debian: true

- name: Install Posit Workbench
  ansible.builtin.apt:
    name: "{{ 'rstudio-server' if workbench_version == 'latest' else 'rstudio-server=' ~ workbench_version }}"
    state: "{{ 'latest' if workbench_version == 'latest' else 'present' }}"
    update_cache: true
    allow_change_held_packages: true
  notify: Restart Workbench

- name: Hold the Workbench package so OS updates don't upgrade it
  ansible.builtin.dpkg_selections:
    name: rstudio-server
    selection: hold