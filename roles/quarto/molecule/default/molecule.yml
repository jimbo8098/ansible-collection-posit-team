---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu2604
    image: ubuntu:26.04


provisioner:
  name: ansible
  inventory:
    host_vars:
      # geerlingguy Rocky images require su instead of sudo due to PAM limitations
      rockylinux9:
        ansible_become_method: su
      rockylinux10:
        ansible_become_method: su

verifier:
  name: ansible